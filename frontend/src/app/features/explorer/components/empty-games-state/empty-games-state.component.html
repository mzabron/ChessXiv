<div class="empty-state">
  <p class="empty-title">No games loaded</p>
  <p class="empty-copy">Import a PGN file, or open one of the shared databases to begin.</p>

  <div class="ui-btn-row actions">
    <button type="button" class="ui-btn ui-btn--primary" (click)="onImportClick()">
      Import database (.pgn)
    </button>
    <button type="button" class="ui-btn" (click)="onBrowseClick()">
      Browse databases
    </button>
  </div>
</div>
