<div class="empty-state">
  <p class="empty-title">Your database is empty</p>
  <p class="empty-copy">Import a PGN file, or open one of the shared databases to begin.</p>

  <div class="actions">
    <button type="button" class="action-button primary" (click)="onImportClick()">
      Import database (.pgn)
    </button>
    <button type="button" class="action-button ghost" (click)="onBrowseClick()">
      Browse databases
    </button>
  </div>
</div>
